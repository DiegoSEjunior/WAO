<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAO — Ropa Urbana · Temporada 01 GENESIS</title>
    <meta
      name="description"
      content="WAO es una marca de ropa construida alrededor de identidad, diseño y propósito. Explora la Temporada 01 · GENESIS: hoodies, crewnecks y piezas urbanas de edición."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('wao-theme')
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
